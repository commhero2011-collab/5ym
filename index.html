<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<meta name="description" content="PathFit - private, adaptive, offline fitness, nutrition and recovery coach">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PathFit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PathFit</title>
<link rel="manifest" href="manifest.webmanifest" id="manifestLink">
<link rel="icon" href="icons/icon-192.png" id="favLink">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" id="appleIcon">
<style>
:root{--bg:#0B1120;--sf:#151F33;--sf2:#1F2A40;--tx:#F1F5F9;--mu:#94A3B8;--bd:#2A3650;--pri:#22D3EE;--vio:#A78BFA;--go:#34D399;--adj:#FBBF24;--rec:#F472B6;--red:#F87171;--onpri:#0B1120;--sh:0 10px 30px rgba(0,0,0,.35);--glow:0 0 24px rgba(34,211,238,.25);--band:var(--pri)}
[data-theme=light]{--bg:#F1F5F9;--sf:#FFFFFF;--sf2:#F1F5F9;--tx:#0F172A;--mu:#475569;--bd:#D8E0EA;--pri:#0891B2;--vio:#7C3AED;--go:#059669;--adj:#D97706;--rec:#DB2777;--red:#DC2626;--onpri:#FFFFFF;--sh:0 6px 20px rgba(15,23,42,.08);--glow:none}
[data-theme=contrast]{--bg:#000;--sf:#0A0A0A;--sf2:#151515;--tx:#FFF;--mu:#E5E5E5;--bd:#FFF;--pri:#00FFFF;--vio:#E0B0FF;--go:#00FF7F;--adj:#FFD700;--rec:#FF69B4;--red:#FF4040;--onpri:#000;--sh:none;--glow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;
 background-image:radial-gradient(900px 500px at 110% -10%,color-mix(in srgb,var(--vio) 14%,transparent),transparent 60%),radial-gradient(700px 400px at -20% 10%,color-mix(in srgb,var(--pri) 12%,transparent),transparent 60%);background-attachment:fixed}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.1em;font-size:17px;background:linear-gradient(90deg,var(--pri),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
.lvl{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:var(--sf);border:1px solid var(--bd);font-size:12px;font-weight:700;white-space:nowrap}
@media(max-width:380px){#hShield{display:none}.brand span{display:none}}
main{max-width:780px;margin:0 auto;padding:14px}
#view.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:color-mix(in srgb,var(--sf) 92%,transparent);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);backdrop-filter:blur(6px)}
.card h3{margin:0 0 10px;font-size:16px}
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,color-mix(in srgb,var(--band) 26%,var(--sf)) 0%,var(--sf) 62%);border-color:color-mix(in srgb,var(--band) 40%,var(--bd))}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--band) 35%,transparent),transparent 70%);pointer-events:none}
.muted{color:var(--mu)}.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button,.btn{font:inherit;cursor:pointer;border-radius:14px;padding:11px 16px;font-weight:700;background:var(--sf2);color:var(--tx);min-height:44px;border:1px solid var(--bd);transition:transform .12s,filter .12s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:default;transform:none}
.btn-pri{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,var(--vio)));color:var(--onpri);border-color:transparent;box-shadow:var(--glow)}
.btn-vio{background:linear-gradient(135deg,var(--vio),var(--rec));color:var(--onpri);border-color:transparent}
.btn-red{background:var(--red);color:#fff;border-color:transparent}
.btn-ghost{background:transparent}
.btn-block{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:44px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input[type=range]{padding:0;accent-color:var(--pri);min-height:32px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--pri);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);cursor:pointer;font-size:13.5px;min-height:38px;font-weight:600}
.chip.on{background:var(--pri);color:var(--onpri);border-color:transparent}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav.bottom button{position:relative;background:none;border:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 8px;min-width:60px;box-shadow:none}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--pri)}
nav.bottom button.on:not(.plus)::before{content:"";position:absolute;top:-6px;width:26px;height:3px;border-radius:3px;background:var(--pri);box-shadow:0 0 10px var(--pri)}
nav.bottom .plus{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--vio));color:var(--onpri)!important;margin-top:-28px;box-shadow:0 8px 24px rgba(34,211,238,.45);justify-content:center}
nav.bottom .plus svg{width:30px;height:30px}
.ring-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.ring-prog{filter:drop-shadow(0 0 6px currentColor)}
.band{font-weight:900;font-size:24px;letter-spacing:.02em}
.why{border-left:4px solid var(--adj);background:var(--sf2);padding:10px 12px;border-radius:12px;font-size:13.5px;margin-top:10px;position:relative;z-index:1}
.bar{height:10px;background:var(--sf2);border-radius:99px;overflow:hidden;border:1px solid var(--bd)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio));border-radius:99px;transition:width .5s}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf2);border-radius:14px;border:1px solid var(--bd)}
.item .grow{flex:1;min-width:0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--sf);padding:5px;border-radius:16px;border:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;background:none;border:none;min-height:38px;padding:8px 10px;white-space:nowrap;box-shadow:none}
.tabs button.on{background:var(--pri);color:var(--onpri)}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeBg .2s}
@keyframes fadeBg{from{opacity:0}}
.modal{background:var(--sf);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--bd);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:24px}}
.modal h2{margin:0 0 12px;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;font-weight:700;box-shadow:var(--sh);max-width:92vw;text-align:center;display:flex;gap:10px;align-items:center;animation:up .2s}
.toast button{min-height:32px;padding:4px 12px;background:var(--bg);color:var(--tx)}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 46px;gap:6px;align-items:center;margin-bottom:6px}
.setrow input{padding:8px;min-height:42px;text-align:center}
.setrow .ok{min-height:42px;padding:0}
.setrow.done .ok{background:var(--go);color:#053;border-color:transparent}
.setrow.done input{opacity:.7}
.timer{font-size:52px;font-weight:900;text-align:center;color:var(--pri)}
.alert{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 14%,var(--sf));padding:12px;border-radius:14px}
.kpi{background:var(--sf2);border-radius:16px;padding:10px;text-align:center;border:1px solid var(--bd)}
.kpi b{display:block;font-size:21px}
.kpi span{font-size:11.5px;color:var(--mu)}
svg text{font-family:inherit}
.map-wrap{overflow:auto;border-radius:20px;border:1px solid var(--bd);background:linear-gradient(180deg,var(--sf2),var(--sf));max-height:68vh}
.node{cursor:pointer}
.hidden{display:none!important}
.center{text-align:center}
.onb{max-width:560px;margin:0 auto;padding:22px 16px calc(22px + env(safe-area-inset-bottom))}
.obprog{height:6px;border-radius:6px;background:var(--sf2);overflow:hidden;margin:6px 0 20px}.obprog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio));transition:width .3s}
.bigchips .chip{padding:14px 16px;font-size:15px;border-radius:16px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt td,table.dt th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{padding:6px 0;border-radius:12px;font-size:11px;color:var(--mu)}
.week div.today{background:var(--sf2);color:var(--tx);font-weight:800;outline:1px solid var(--pri)}
.week i{display:block;width:12px;height:12px;border-radius:50%;margin:5px auto 0;border:2px solid var(--bd)}
.week i.trained{background:var(--go);border-color:var(--go);box-shadow:0 0 8px var(--go)}
.week i.active{background:var(--pri);border-color:var(--pri)}
.week i.planned{border-color:var(--vio);border-style:dashed}
.demo{display:flex;justify-content:center;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--pri) 14%,transparent),transparent 70%);border-radius:16px;margin-bottom:8px}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.medal{text-align:center;font-size:11.5px}
.medal.locked{opacity:.38;filter:grayscale(1)}
.dots{display:flex;gap:5px;justify-content:center;margin:6px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--go)}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:90;transition:opacity .4s}
.splash svg{animation:pop 1.2s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.08) rotate(-3deg)}}
.coach{display:flex;gap:12px;align-items:flex-start}
.coach .bubble{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="splash" id="splash"><svg width="96" height="96" viewBox="0 0 512 512"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><rect width="512" height="512" rx="110" fill="#151F33"/><path d="M96 380 C170 380 170 250 250 250 S330 130 416 130" stroke="url(#sg)" stroke-width="38" fill="none" stroke-linecap="round"/><circle cx="96" cy="380" r="36" fill="#34D399"/><circle cx="250" cy="250" r="30" fill="#FBBF24"/><circle cx="416" cy="130" r="44" fill="#F472B6"/></svg><div style="font-weight:900;letter-spacing:.2em;color:#22D3EE">PATHFIT</div></div></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
"use strict";
/* ================= PathFit PWA v3 ================= */
const APP_VERSION="3.0.0", SCHEMA_VERSION=3;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return dkey(d);};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const nowISO=()=>new Date().toISOString();
const round=(v,n=0)=>{const p=10**n;return Math.round(v*p)/p;};

/* ---------- PWA ---------- */
const ICON_SVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><rect width="512" height="512" rx="110" fill="#151F33"/><path d="M96 380 C170 380 170 250 250 250 S330 130 416 130" stroke="url(#g)" stroke-width="38" fill="none" stroke-linecap="round"/><circle cx="96" cy="380" r="36" fill="#34D399"/><circle cx="250" cy="250" r="30" fill="#FBBF24"/><circle cx="416" cy="130" r="44" fill="#F472B6"/></svg>`;
let SW_REG=null;
function setupPWA(){
  if(location.protocol==="file:"){ const iconURL="data:image/svg+xml;base64,"+btoa(ICON_SVG); $("#favLink").href=iconURL; $("#appleIcon").href=iconURL; return; }
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js",{scope:"./"}).then(reg=>{
    SW_REG=reg;
    if(reg.waiting&&navigator.serviceWorker.controller) updateReady(reg);
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; w&&w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) updateReady(reg); }); });
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(e=>console.warn("SW registration failed",e));
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded) return; reloaded=true; location.reload(); });
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.action) handleAction(e.data.action); });
}
function updateReady(reg){
  if($("#updBar")) return;
  const bar=document.createElement("div"); bar.className="toast"; bar.id="updBar";
  bar.innerHTML='<span>✨ New PathFit version ready</span><button>Update</button>';
  bar.querySelector("button").onclick=()=>{ reg.waiting&&reg.waiting.postMessage("SKIP_WAITING"); bar.remove(); };
  document.body.appendChild(bar);
}
function netStatus(){ const off=!navigator.onLine; let b=$("#offBadge");
  if(off&&!b&&$(".lvl")){ b=document.createElement("span"); b.id="offBadge"; b.className="pill"; b.textContent="⚡ Offline"; b.title="Working offline — all features available"; $(".lvl").prepend(b); }
  if(!off&&b) b.remove(); }
addEventListener("online",netStatus); addEventListener("offline",netStatus);
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;});
window.addEventListener("appinstalled",()=>{deferredInstall=null;toast("✅ PathFit installed");});
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

/* ---------- IndexedDB ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("pathfit",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");};r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  get(k){return new Promise((res,rej)=>{const t=this.db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});},
  set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});},
  del(k){return new Promise(res=>{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=()=>res();});}
};

/* ---------- Web Crypto ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptJSON(obj,key,salt){ const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));
  return {v:1,alg:"AES-GCM/PBKDF2-SHA256-310k",salt:b64(salt),iv:b64(iv),ct:b64(ct)}; }
async function decryptJSON(pkg,key){ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(pkg.iv)},key,unb64(pkg.ct)); return JSON.parse(dec.decode(pt)); }
let SESSION_KEY=null, SESSION_SALT=null;

/* ---------- Exercise library (d = animation demo key) ---------- */
const EX=[
 {id:"sq_bw",n:"Bodyweight Squat",p:"squat",eq:["none"],t:"strength",m:["quads","glutes"],load:["knee","hip"],reps:[10,20],d:"squat",cue:"Feet shoulder-width, sit back, knees track over toes, chest proud.",mist:"Heels lifting; knees caving in.",reg:"Box squat",prog:"Goblet squat"},
 {id:"sq_gob",n:"Goblet Squat",p:"squat",eq:["db"],t:"strength",m:["quads","glutes"],load:["knee","hip"],reps:[8,12],w:true,d:"squat",cue:"Hold dumbbell at chest, elbows inside knees at the bottom.",mist:"Rounding upper back.",reg:"Bodyweight squat",prog:"Barbell back squat"},
 {id:"sq_bb",n:"Barbell Back Squat",p:"squat",eq:["gym"],t:"strength",m:["quads","glutes","core"],load:["knee","hip","lower_back"],reps:[5,8],w:true,bar:true,d:"squat",cue:"Brace, break at hips and knees together, drive up through mid-foot.",mist:"Losing brace; good-morning squat.",reg:"Goblet squat",prog:"Pause squat"},
 {id:"split_sq",n:"Split Squat",p:"lunge",eq:["none","db"],t:"strength",m:["quads","glutes"],load:["knee","hip"],reps:[8,12],d:"lunge",cue:"Long stance, back knee lowers straight down.",mist:"Front knee collapsing inward.",reg:"Assisted split squat",prog:"Rear-foot-elevated split squat"},
 {id:"glute_br",n:"Glute Bridge",p:"hinge",eq:["none"],t:"strength",m:["glutes","hamstrings"],load:["hip"],reps:[12,20],d:"bridge",cue:"Ribs down, squeeze glutes at the top for 2 s.",mist:"Arching lower back.",reg:"Short-range bridge",prog:"Single-leg bridge"},
 {id:"rdl_db",n:"Dumbbell Romanian Deadlift",p:"hinge",eq:["db"],t:"strength",m:["hamstrings","glutes"],load:["lower_back","hip"],reps:[8,12],w:true,d:"hinge",cue:"Soft knees, push hips back, dumbbells close to legs.",mist:"Rounding the back.",reg:"Glute bridge",prog:"Barbell RDL"},
 {id:"dl_bb",n:"Barbell Deadlift",p:"hinge",eq:["gym"],t:"strength",m:["posterior chain"],load:["lower_back","hip"],reps:[3,6],w:true,bar:true,d:"hinge",cue:"Bar over mid-foot, lats tight, push the floor away.",mist:"Jerking the bar; hips shooting up.",reg:"Dumbbell RDL",prog:"Paused deadlift"},

function defaultState(){
  return {meta:{schema_version:SCHEMA_VERSION,app_version:APP_VERSION,install_date:dkey(),last_backup:null,migrations:[]},
   profile:null,
   settings:{theme:"dark",voice:true,sound:true,reduceMotion:false,hideNumbers:false,quietStart:"22:00",quietEnd:"07:00",waterNudges:true,restDefault:90,reminders:false,checkinTime:"08:30"},
   checkins:{},sessions:[],nutrition:{},foods_custom:[],favourites:[],templates:[],barcodes:{},rehab:[],regions:{},body:[],
   map:{nodes:[],current:0,generated:null},xp:{total:0,events:[]},streak:{count:0,best:0,last:null,shields:0},prs:{},
   progression:{},baseline:null,mobilityTests:[],radarHistory:[],changeLog:[],notes:[],challengesDone:{},clearance:false,
   achievements:{},medals:{},notified:{}};
}
let S=defaultState();
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,250);}
async function persist(){ saveTimer=null;
  try{ if(S.meta.locked && SESSION_KEY){ await DB.set("state_enc",await encryptJSON(S,SESSION_KEY,SESSION_SALT)); await DB.del("state"); }
    else { await DB.set("state",S); await DB.del("state_enc"); } }
  catch(e){console.error(e);toast("Save failed: "+e.message);} }
addEventListener("pagehide",()=>{ if(saveTimer){clearTimeout(saveTimer);persist();} });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&saveTimer){clearTimeout(saveTimer);persist();} });
function migrate(st){
  const d=defaultState();
  for(const k in d){ if(st[k]===undefined) st[k]=d[k]; }
  for(const k in d.settings){ if(st.settings[k]===undefined) st.settings[k]=d.settings[k]; }
  if((st.meta.schema_version||1)<SCHEMA_VERSION){ st.meta.migrations.push({from:st.meta.schema_version||1,to:SCHEMA_VERSION,at:nowISO()}); st.meta.schema_version=SCHEMA_VERSION; }
  st.meta.app_version=APP_VERSION;
  return st;
}

/* ======================= SMART ENGINE ======================= */
const Engine={
  sessionLoad:(rpe,min)=>Math.round((+rpe||0)*(+min||0)),
  loadOnDay(k){return S.sessions.filter(s=>s.date===k).reduce((a,s)=>a+(s.session_load||0),0);},
  acwr(k=dkey()){ let acute=0,chronic=0;
    for(let i=0;i<7;i++) acute+=this.loadOnDay(addDays(k,-i));
    for(let i=0;i<28;i++) chronic+=this.loadOnDay(addDays(k,-i));
    const cw=chronic/4; if(cw<50) return null; return round(acute/cw,2); },
  loadScore(r){ if(r==null) return 85; if(r>=0.8&&r<=1.3) return 100;
    if(r>1.3) return clamp(100-(r-1.3)/0.3*100,0,100); return clamp(100-(0.8-r)/0.3*100,0,100);},
  readiness(c){
    const target=S.profile?.sleepTarget||8;
    const sleep=clamp(clamp(c.sleep_h/target,0,1)*(0.5+c.sleep_q/10)*100,0,100);
    const energy=(c.energy-1)/4*100, sore=(5-c.soreness)/4*100, stress=(5-c.stress)/4*100;
    const r=this.acwr(); const load=this.loadScore(r);
    const score=Math.round(sleep*.30+energy*.20+sore*.20+stress*.15+load*.15);
    const ex=[];
    if(c.sleep_h<target-1) ex.push(`slept ${c.sleep_h} h (target ${target} h)`);
    if(c.sleep_q<=2) ex.push("poor sleep quality");
    if(c.energy<=2) ex.push("low energy");
    if(c.soreness>=4) ex.push("high soreness");
    if(c.stress>=4) ex.push("high stress");
    if(r!=null&&r>1.3) ex.push(`training load spiking (ratio ${r})`);
    if(r!=null&&r<0.8) ex.push(`load below your usual (ratio ${r})`);
    let band=score>=75?"go":score>=50?"adjust":"recover";
    if(this.activeRedFlag()) {band="override";ex.unshift("active pain red flag");}
    return {readiness:score,band,acwr:r,explanation:ex};
  },
  effectiveBand(k=dkey()){ if(this.activeRedFlag()) return "override"; const c=S.checkins[k]; if(!c) return "go"; if(c.keepPlan&&c.band!=="override") return "go"; return c.band; },
  activePain(days=3){ const since=addDays(dkey(),-days); const m={};
    S.rehab.filter(l=>l.date>=since&&l.status!=="resolved").forEach(l=>{ if(!m[l.region]||l.ts>m[l.region].ts) m[l.region]=l; }); return m; },
  activeRedFlag(){ const ap=this.activePain(2); return Object.values(ap).some(l=>l.pain>=7||(l.flags&&l.flags.length)); },
  bandInfo:{go:{lbl:"GO",col:"#34D399",msg:"You're ready — let's build.",plan:"Planned session as is; progression allowed."},
    adjust:{lbl:"ADJUST",col:"#FBBF24",msg:"Smart day — quality over quantity.",plan:"Volume −25%, effort capped at RPE 7, no max attempts."},
    recover:{lbl:"RECOVER",col:"#F472B6",msg:"Recovery is training too.",plan:"Swapped to an active-recovery session: mobility, walk, breathing."},
    override:{lbl:"SAFETY",col:"#F87171",msg:"Let's protect that area today.",plan:"Rest / rehab-only. Consider professional assessment."}},
  targets(k=dkey()){
    const p=S.profile; if(!p) return null;
    const wt=this.latestWeight()||p.weight;
    const sexAdj=p.sexCalc==="male"?5:p.sexCalc==="female"?-161:-78;
    const bmr=10*wt+6.25*p.height-5*p.age+sexAdj;
    const af={sedentary:1.2,light:1.375,moderate:1.55,active:1.725}[p.activity]||1.375;
    const load=this.loadOnDay(k)||((k===dkey()&&this.todayNode()?.type==="session")?250:0);
    let kcal=bmr*af+Math.round(load*0.9);
    if(p.goal==="fatloss") kcal=Math.max(bmr*1.05,kcal-Math.min(500,wt*7700*0.0075/7));
    if(p.goal==="strength") kcal+=200;
    kcal=Math.round(kcal);
    const protein=Math.round(wt*(p.goal==="fatloss"||p.goal==="strength"?2.0:1.6));
    const fat=Math.round(kcal*0.25/9);
    const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
    const durH=S.sessions.filter(s=>s.date===k).reduce((a,s)=>a+s.duration_min,0)/60;
    const hot=(S.nutrition[k]?.hot)?1.3:1;
    const water=Math.round((wt*33+durH*(p.sweatRate||0.75)*1000*hot)/50)*50;
    return {bmr:Math.round(bmr),kcal,protein,fat,carbs,fibre:p.sexCalc==="female"?25:30,water};
  },
  latestWeight(){const b=[...S.body].filter(x=>x.weight).sort((a,b)=>a.date<b.date?1:-1)[0];return b?b.weight:null;},
  REGIONS:[
    {id:"foundation",n:"Foundation Valley",c:"#34D399",focus:"Habit, technique, base fitness",boss:"Complete the valley with ≥ 80% on-time stops",icon:"🌱",deco:["🌱","🌿","🌼"]},
    {id:"strength",n:"Strength Peaks",c:"#A78BFA",focus:"Progressive strength blocks",boss:"Re-test: beat your baseline or set a PR",icon:"⛰️",deco:["⛰️","🏔️","🪨"]},
    {id:"endurance",n:"Endurance Coast",c:"#22D3EE",focus:"Aerobic capacity, intervals",boss:"30 minutes continuous run/walk",icon:"🌊",deco:["🌊","🐚","⛵"]},
    {id:"mobility",n:"Mobility Forest",c:"#10B981",focus:"Range of motion, posture",boss:"Improve 2 of 3 mobility self-tests",icon:"🌲",deco:["🌲","🍃","🦋"]},
    {id:"recovery",n:"Recovery Springs",c:"#F472B6",focus:"Deloads, active recovery",boss:"Average readiness ≥ 70 for a week",icon:"♨️",deco:["♨️","🌙","💧"]}],
  regionOf(id){return this.REGIONS.find(r=>r.id===id)||this.REGIONS[0];},
  generateMap(){
    const p=S.profile; const perWeek=clamp(+p.days||3,2,6);
    const order=["foundation"]; const weak=this.weakestAxis();
    const pref={strength:"strength",endurance:"endurance",fatloss:"endurance",health:"mobility",rehab:"mobility"}[p.goal]||"strength";
    const first=(S.baseline&&S.baseline.pushups&&weak)?weak:pref;
    order.push(first); ["strength","endurance","mobility"].filter(x=>x!==first).forEach(x=>order.push(x));
    const nodes=[]; let day=dkey(); const gap=Math.max(1,Math.floor(7/perWeek));
    order.forEach(rid=>{
      for(let i=0;i<perWeek*3;i++){
        const isDeload=(nodes.length+1)%(perWeek*5)===0;
        nodes.push({id:uid(),region:isDeload?"recovery":rid,type:isDeload?"recovery":"session",focus:this.focusFor(isDeload?"recovery":rid,i),status:"locked",planned:day,title:""});
        day=addDays(day,gap);
      }
      nodes.push({id:uid(),region:rid,type:"boss",focus:"boss",status:"locked",planned:day,title:this.regionOf(rid).boss});
      day=addDays(day,gap);
    });
    nodes.forEach((n,i)=>{n.idx=i;if(!n.title)n.title=this.nodeTitle(n);});
    nodes[0].status="current";
    S.map={nodes,current:0,generated:nowISO()};
    S.changeLog.unshift({at:nowISO(),text:`Journey generated: ${order.map(r=>this.regionOf(r).n).join(" → ")}.`});
  },
  focusFor(rid,i){
    if(rid==="foundation") return ["full","cardio","full","mobility"][i%4];
    if(rid==="strength") return ["lower","upper","full"][i%3];
    if(rid==="endurance") return ["cardio","full","cardio"][i%3];
    if(rid==="mobility") return ["mobility","full","mobility"][i%3];
    return "recovery";
  },
  nodeTitle(n){return {full:"Full-body strength",lower:"Lower-body strength",upper:"Upper-body strength",cardio:"Cardio builder",mobility:"Mobility flow",recovery:"Active recovery",boss:"Boss test"}[n.focus]||"Session";},
  todayNode(){return S.map.nodes[S.map.current];},
  reindex(){S.map.nodes.forEach((x,i)=>x.idx=i);},
  insertFork(kind,reason,tag){
    const cur=S.map.current, n=S.map.nodes[cur]; if(!n||n.forkInserted===dkey()) return;
    const node={id:uid(),region:"recovery",type:"recovery",focus:"recovery",status:"current",planned:dkey(),title:kind==="lighter"?"Lower-volume path":"Active recovery loop",fork:true,fork_reason:reason,forkTag:tag||"",forkInserted:dkey()};
    n.status="locked"; n.forkInserted=dkey(); S.map.nodes.splice(cur,0,node); this.reindex();

      if(trimmed) note.push(`Weekly volume capped at +10% (${trimmed} set${trimmed>1?"s":""} trimmed) to protect against overuse.`); }

  startLoad(e){const wt=S.profile.weight||70;const lvl=S.profile.level;

  progress(log){

    });

function level(xp=S.xp.total){let l=1,need=200,acc=0;while(xp>=acc+need){acc+=need;l++;need=Math.round(need*1.18);}return {l,into:xp-acc,need};}
const LEVEL_TITLES=["Rookie","Explorer","Pathfinder","Trailblazer","Summiteer","Champion","Legend"];
const levelTitle=l=>LEVEL_TITLES[Math.min(LEVEL_TITLES.length-1,Math.floor((l-1)/3))];
let SESSION_XP=null; // collects XP during a workout save for the summary
function addXP(n,why){ const before=level().l; S.xp.total+=n; S.xp.events.unshift({at:nowISO(),xp:n,why}); if(S.xp.events.length>400) S.xp.events.length=400;
  if(SESSION_XP) SESSION_XP.xp+=n;
  const after=level().l; if(after>before){ if(SESSION_XP) SESSION_XP.levelUp=after; else levelUp(after); } save(); updateHeader(); }
function markActiveDay(){
  const k=dkey(); const st=S.streak; if(st.last===k) return;
  if(st.last){ const gap=daysBetween(st.last,k);
    if(gap===1) st.count++;
    else if(gap===2&&st.shields>0){ st.shields--; st.count++; toast("🛡️ Streak shield used — streak protected!"); }
    else st.count=1;
  } else st.count=1;
  st.last=k; st.best=Math.max(st.best,st.count);
  if(st.count%7===0){ st.shields=Math.min(3,st.shields+1); toast("🛡️ 7-day streak — you earned a streak shield!"); }
  save(); updateHeader();
}
function healthyDaysThisWeek(){ let n=0; for(let i=0;i<7;i++){ if(dayActive(addDays(dkey(),-i))) n++; } return n; }
function dayActive(k){ return S.sessions.some(s=>s.date===k) || (S.nutrition[k]&&waterTotal(k)>=(Engine.targets(k)?.water||2000)) || !!S.challengesDone[k] || !!S.checkins[k]; }
function waterTotal(k=dkey()){return (S.nutrition[k]?.water||[]).reduce((a,w)=>a+w.ml,0);}
function dayNut(k=dkey()){ if(!S.nutrition[k]) S.nutrition[k]={meals:[],water:[]}; return S.nutrition[k]; }
function totals(k=dkey()){ const m=S.nutrition[k]?.meals||[]; return m.reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f,fib:a.fib+(x.fib||0)}),{kcal:0,p:0,c:0,f:0,fib:0}); }

function tickRest(){ const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000)); const el=$("#pRestRing");

  if(left<=0){ beep(1000,.25); haptic([80,50,80]); speak("Go. Next set."); stopRest(); } }
function startRest(sec){ stopRest(); restTotal=sec; restEnd=Date.now()+sec*1000; tickRest.s10=0; tickRest.last=null; const p=$("#pRest"); p&&p.classList.remove("hidden"); restInt=setInterval(tickRest,250); tickRest(); }

function intervalTimer(it){
  let work=60,rest=60,rounds=Math.max(1,Math.round((it.min||20)/2)),r=1,phase="work",phaseEnd=0,int=null,last=null,startT=0;
  const b=modal(`<h2>⏱️ Interval timer</h2><div class="grid3"><div><label>Work (s)</label><input id="iW" type="number" value="${work}"></div><div><label>Easy (s)</label><input id="iR" type="number" value="${rest}"></div><div><label>Rounds</label><input id="iN" type="number" value="${rounds}"></div></div>
   <div class="center" style="margin:12px 0"><div id="iPh" class="band">Ready</div><div id="iRing"></div><div class="muted num" id="iRd"></div></div>
   <div class="row"><button id="iGo" class="btn-pri" style="flex:1">Start</button><button id="iX">Close</button></div>`);
  b.dataset.lock="1";
  const draw=()=>{ const left=Math.max(0,Math.ceil((phaseEnd-Date.now())/1000)); const tot=phase==="work"?work:rest; const col=phase==="work"?"#34D399":"#22D3EE";
    $("#iRing").innerHTML=ring(left,tot,col,170,`${Math.floor(left/60)}:${pad(left%60)}`,phase==="work"?"WORK":"EASY"); $("#iPh").textContent=phase==="work"?"WORK 🔥":"EASY 🌊"; $("#iPh").style.color=col; $("#iRd").textContent=`Round ${r}/${rounds}`;
    if(left<=3&&left>0&&last!==left){last=left;beep(700,.06);}
    if(left<=0){ if(phase==="work"){phase="rest";phaseEnd=Date.now()+rest*1000;speak("Easy");} else { r++; if(r>rounds){clearInterval(int);speak("Intervals complete. Great work.");it.minutes_done=Math.round((Date.now()-startT)/60000)||Math.round(rounds*(work+rest)/60);it.sets_done[0].done=true;it.sets_done[0].rpe=it.sets_done[0].rpe||6;celebrate();renderPlayer();return;} phase="work";phaseEnd=Date.now()+work*1000;speak("Work"); } beep(1000,.2); haptic(60);} };
  $("#iGo").onclick=()=>{ work=+$("#iW").value||60;rest=+$("#iR").value||60;rounds=+$("#iN").value||1; phase="work"; r=1; startT=Date.now(); phaseEnd=Date.now()+work*1000; speak("Work"); clearInterval(int); int=setInterval(draw,250); draw(); $("#iGo").disabled=true; };
  $("#iX").onclick=()=>{ clearInterval(int); if(startT&&!it.sets_done[0].done) it.minutes_done=Math.max(it.minutes_done,Math.round((Date.now()-startT)/60000)); renderPlayer(); };
}
function plateCalc(target){
  const calc=t=>{ let side=(t-20)/2; const plates=[25,20,15,10,5,2.5,1.25]; const out=[]; if(side<0) return "Below bar weight (20 kg)."; plates.forEach(p=>{while(side>=p-1e-9){out.push(p);side-=p;}}); return out.length?`Each side: ${out.join(" + ")} kg`:"Empty bar"; };
  const wu=v=>[[.4,8],[.6,5],[.8,3]].map(([f,r])=>`${Math.max(20,round(v*f/2.5)*2.5)} kg × ${r}`).join(" · ");
  const b=modal(`<h2>🏋️ Plate calculator</h2><label>Working weight (kg)</label><input id="pcW" type="number" value="${target}"><p id="pcO" class="band" style="font-size:17px"></p>
  <h3>Warm-up sets</h3><p id="pcWU"></p><button id="pcX" class="btn-pri">Back</button>`);
  b.dataset.lock="1"; const u=()=>{const v=+$("#pcW").value;$("#pcO").textContent=calc(v);$("#pcWU").textContent=wu(v);}; $("#pcW").oninput=u; u(); $("#pcX").onclick=renderPlayer;
}

function sessionStats(log){ const sets=log.items.reduce((a,i)=>a+i.sets_done.filter(s=>s.done).length,0);

  if((m=t.match(/pain\s+([a-z ]+?)\s+(\d+)/))){ const reg=BODY_REGIONS.find(([k,l])=>m[1].includes(l.toLowerCase().split(" ")[0])||m[1].includes(k.replace("_"," "))); if(reg){ savePain(reg[0],+m[2],"dull",[],[]); toast(`Pain ${reg[1]} ${m[2]}/10 logged`); return;} }

  ${SUB.body==="fuel"?vFuel():SUB.body==="recover"?vRecover():SUB.body==="moves"?vMoves():vMetrics()}`; }

     <div class="center">${ring(Math.round(tot.f),t.fat,"#F472B6",82,Math.round(tot.f),"/"+t.fat+"g")}<div class="small muted">Fat</div></div></div>
   <p class="small muted center">Fibre ${Math.round(tot.fib)}/${t.fibre} g · BMR ${t.bmr} kcal · targets rise on training days. General wellness defaults — not medical advice.</p>`}
   <div class="row" style="position:relative;z-index:1"><button id="fAdd" class="btn-pri" style="flex:1">+ Log food</button><button id="fScan">📷 Scan</button><button id="fCopy">Copy yesterday</button></div></div>

   <button id="fSaveTpl" style="margin-top:10px">💾 Save as meal template</button>`:`<p class="muted small">Nothing yet — log your first meal. Tip: ⭐ foods become one-tap in Quick Log.</p>`}</div>
  <div class="card"><div class="row"><h3 style="margin:0;flex:1">💧 Hydration</h3><label class="row small" style="margin:0"><input type="checkbox" id="fHot" ${n.hot?"checked":""}> Hot day</label></div>
   <div class="row" style="align-items:center;margin-top:8px"><div>${ring(w,t.water,"#38BDF8",92,(w/1000).toFixed(1)+"L","/"+(t.water/1000).toFixed(1))}</div>
   <div style="flex:1"><div class="grid2"><button class="wq" data-ml="150">☕ Tea</button><button class="wq" data-ml="250">💧 +250</button><button class="wq" data-ml="500">🥤 +500</button><button class="wq" data-ml="330">⚡ Electrolyte</button></div></div></div>
   <p class="small muted">Baseline ~33 ml/kg + ${round((S.profile.sweatRate||0.75),2)} L per training hour. <a href="#" id="fSweat" style="color:var(--pri)">Calibrate sweat rate</a></p></div>

}
function mealDialog(){
  modal(`<h2>🍽️ Log food</h2><div class="row"><input id="fs" placeholder="Search (English or عربي): ful, فول, chicken…" autocomplete="off" style="flex:1;width:auto"><button id="fsScan" aria-label="Scan barcode">📷</button></div>
   <div class="chips" style="margin:8px 0"><button class="chip" id="fsCustom">+ Custom food</button>${S.templates.map((t,i)=>`<button class="chip tplUse" data-i="${i}">📋 ${esc(t.name)}</button>`).join("")}</div>
   <div class="list" id="fl" style="max-height:48vh;overflow:auto"></div>`,{onOpen:b=>{
    const draw=q=>{ q=(q||"").toLowerCase().trim(); const fav=S.favourites.map(f=>f.name);
      const list=allFoods().filter(f=>!q||f.name.toLowerCase().includes(q)||(f.alias||"").includes(q)).sort((a,b)=>(fav.includes(b.name)-fav.includes(a.name))||(b.custom?1:0)-(a.custom?1:0)).slice(0,50);
      $("#fl").innerHTML=list.map(f=>`<div class="item"><button class="fpick btn-ghost grow" data-n="${esc(f.name)}" style="text-align:left;border:none;padding:0;min-height:40px"><b>${fav.includes(f.name)?"⭐ ":""}${esc(f.name)}</b>${f.alias?` <span class="muted small">${esc(f.alias.split(" ")[0])}</span>`:""}<div class="small muted">${f.kcal} kcal · P ${f.p} /100 g${f.hint?" · "+esc(f.hint):""}</div></button>${f.custom?`<button class="fdel btn-ghost" data-n="${esc(f.name)}" aria-label="Delete custom food" style="border:none">🗑️</button>`:""}</div>`).join("")||`<p class="muted small">No match — add a custom food.</p>`;
      $$(".fpick",b).forEach(x=>x.onclick=()=>portionDialog(allFoods().find(f=>f.name===x.dataset.n)));
      $$(".fdel",b).forEach(x=>x.onclick=()=>{ const i=S.foods_custom.findIndex(f=>f.name===x.dataset.n); const rem=S.foods_custom.splice(i,1)[0]; S.favourites=S.favourites.filter(f=>f.name!==rem.name); save(); draw($("#fs").value); toast("Custom food deleted",2600,()=>{S.foods_custom.splice(i,0,rem);save();draw($("#fs").value);}); }); };
    $("#fs").oninput=e=>draw(e.target.value); draw("");
    $("#fsCustom").onclick=()=>customFood({}); $("#fsScan").onclick=scanBarcode;
    $$(".tplUse",b).forEach(x=>x.onclick=()=>{ const t=S.templates[+x.dataset.i]; t.meals.forEach(m=>dayNut().meals.push({...m,id:uid(),t:nowISO()})); save(); closeModal(); toast(`Template "${t.name}" logged`); afterMeal(); }); }});
}
function portionDialog(f){
  modal(`<h2>${esc(f.name)}</h2><p class="small muted">${f.hint?esc(f.hint)+" · ":""}${f.kcal} kcal / 100 g</p>
  <label>Amount (g or ml)</label><input id="pg" type="number" inputmode="decimal" value="${f.grams||100}">
  <div class="chips" style="margin-top:8px">${[0.5,1,1.5,2].map(m=>`<button class="chip pm" data-m="${m}">${m}× portion</button>`).join("")}</div>
  <p id="pgc" class="band" style="font-size:16px"></p>
  <div class="row"><button id="pgOk" class="btn-pri" style="flex:1">Add</button><button id="pgFav">☆ Favourite</button><button id="pgBack">Back</button></div>`,{onOpen:b=>{
    const u=()=>{const g=+$("#pg").value||0;$("#pgc").textContent=S.settings.hideNumbers?"":`${Math.round(f.kcal*g/100)} kcal · P ${round(f.p*g/100,1)} g · C ${round(f.c*g/100,1)} g · F ${round(f.f*g/100,1)} g`;};
    $("#pg").oninput=u; u(); $$(".pm",b).forEach(x=>x.onclick=()=>{$("#pg").value=Math.round((f.grams||100)*+x.dataset.m);u();});
    $("#pgOk").onclick=()=>{logFood(f,+$("#pg").value||0);closeModal();toast(`Logged ${f.name}`);afterMeal();};
    $("#pgFav").onclick=()=>{ if(!S.favourites.find(x=>x.name===f.name)) S.favourites.unshift({...f,grams:+$("#pg").value||f.grams}); save(); toast("⭐ Added to favourites"); };
    $("#pgBack").onclick=mealDialog; }});
}
function logFood(f,g){ const m=g/100; dayNut().meals.push({id:uid(),t:nowISO(),name:f.name,grams:g,kcal:f.kcal*m,p:f.p*m,c:f.c*m,f:f.f*m,fib:(f.fib||0)*m,entry_method:"manual"}); save(); }
function afterMeal(){ const k=dkey(),t=Engine.targets(k),tot=totals(k); const flagKey="prot_"+k;
  if(tot.p>=t.protein&&!S.challengesDone[flagKey]){ S.challengesDone[flagKey]=1; addXP(15,"Protein target hit"); markActiveDay(); celebrate(); toast("💪 Protein target reached!"); }
  checkAchievements(); render(); }
function customFood({barcode}={}){
  modal(`<h2>${barcode?"📷 New product":"➕ Custom food"}</h2>${barcode?`<p class="small muted">Barcode <b>${esc(barcode)}</b> isn't linked yet. Enter values from the label once — next scan logs it instantly.</p>`:""}
  <label>Name</label><input id="cfN"><div class="grid2"><div><label>kcal /100 g</label><input id="cfK" type="number" inputmode="decimal"></div><div><label>Protein g</label><input id="cfP" type="number" inputmode="decimal"></div><div><label>Carbs g</label><input id="cfC" type="number" inputmode="decimal"></div><div><label>Fat g</label><input id="cfF" type="number" inputmode="decimal"></div><div><label>Fibre g</label><input id="cfFi" type="number" inputmode="decimal"></div><div><label>Usual portion g</label><input id="cfG" type="number" inputmode="decimal" value="100"></div></div>
  ${barcode?`<label>…or link to an existing food</label><select id="cfL"><option value="">— choose —</option>${allFoods().map(f=>`<option>${esc(f.name)}</option>`).join("")}</select>`:""}
  <button id="cfS" class="btn-pri btn-block" style="margin-top:12px">Save</button>`,{onOpen:()=>{ $("#cfS").onclick=()=>{
    const link=$("#cfL")&&$("#cfL").value; if(barcode&&link){ S.barcodes[barcode]=link; save(); toast("Barcode linked"); portionDialog(allFoods().find(f=>f.name===link)); return; }

    S.foods_custom.unshift(f); if(barcode) S.barcodes[barcode]=n; save(); portionDialog(f); }; }});
}
bind.body=()=>{
  $$(".tabs button").forEach(b=>b.onclick=()=>{SUB.body=b.dataset.s;render();});
  if(SUB.body==="fuel"){
    $("#fAdd").onclick=mealDialog; $("#fScan").onclick=scanBarcode;
    $("#fCopy").onclick=()=>{ const y=S.nutrition[addDays(dkey(),-1)]; if(!y||!y.meals.length){toast("Nothing logged yesterday.");return;} y.meals.forEach(m=>dayNut().meals.push({...m,id:uid(),t:nowISO()})); save(); toast("Copied yesterday's meals"); afterMeal(); };
    $$(".mDel").forEach(b=>b.onclick=()=>{const i=+b.dataset.i; const m=dayNut().meals.splice(i,1)[0]; save(); render(); toast(`Removed ${m.name}`,2600,()=>{dayNut().meals.splice(i,0,m);save();render();});});
    $$(".mFav").forEach(b=>b.onclick=()=>{const m=dayNut().meals[+b.dataset.i];const f=allFoods().find(x=>x.name===m.name);if(f&&!S.favourites.find(x=>x.name===f.name)){S.favourites.unshift({...f,grams:m.grams});save();toast("⭐ Favourite added");}else toast("Already a favourite");});
    $("#fSaveTpl")&&($("#fSaveTpl").onclick=()=>{const n=prompt("Template name (e.g. Usual breakfast)");if(n){S.templates.push({name:n,meals:dayNut().meals.map(({id,t,...r})=>r)});save();toast("Template saved");}});
    $$(".wq").forEach(b=>b.onclick=()=>addWater(+b.dataset.ml));
    $("#fHot").onchange=e=>{dayNut().hot=e.target.checked;save();render();};
    $("#fSweat").onclick=e=>{e.preventDefault(); modal(`<h2>💦 Sweat-rate calibration</h2><p class="small muted">Weigh yourself (minimal clothing) before and after a ~1-hour session. 1 kg lost ≈ 1 L.</p><div class="grid3"><div><label>Before (kg)</label><input id="s1" type="number" step="0.1"></div><div><label>After (kg)</label><input id="s2" type="number" step="0.1"></div><div><label>Drank (L)</label><input id="s3" type="number" step="0.1" value="0"></div></div><label>Duration (min)</label><input id="s4" type="number" value="60"><button id="sS" class="btn-pri btn-block" style="margin-top:12px">Calculate</button>`,{onOpen:()=>{$("#sS").onclick=()=>{const r=((+$("#s1").value-+$("#s2").value)+(+$("#s3").value))/((+$("#s4").value||60)/60);if(!(r>0&&r<4)){toast("Please check the values.");return;}S.profile.sweatRate=round(r,2);save();closeModal();toast(`Sweat rate ${round(r,2)} L/h saved`);render();};}});};
  } else if(SUB.body==="recover") bindRecover(); else if(SUB.body==="moves") bindMoves(); else bindMetrics();
};

let MOVEQ="", MOVEF="all";
function vMoves(){
  const cats=[["all","All"],["strength","💪 Strength"],["cardio","🏃 Cardio"],["mobility","🧘 Mobility"],["recovery","♨️ Rehab"]];
  return `<div class="card"><h3>🏋️ Exercise library</h3><input id="mvQ" placeholder="Search exercises or muscles" value="${esc(MOVEQ)}"><div class="chips" style="margin-top:10px">${cats.map(([k,l])=>`<button class="chip mvF ${MOVEF===k?"on":""}" data-k="${k}">${l}</button>`).join("")}</div></div>
   <div class="list" id="mvL"></div>`;
}
function bindMoves(){
  const draw=()=>{ const q=MOVEQ.toLowerCase(); const list=EX.filter(e=>(MOVEF==="all"||e.t===MOVEF)&&(!q||e.n.toLowerCase().includes(q)||e.m.join(" ").includes(q)));
    $("#mvL").innerHTML=list.map(e=>{ const ok=Engine.equipOK(e), blocked=Engine.painBlocked(e), pr=S.prs[e.id];
      return `<button class="item mv" data-id="${e.id}" style="text-align:left"><div style="flex:none">${demoSVG(e.d,58)}</div><div class="grow"><b>${esc(e.n)}</b><div class="small muted">${e.m.join(", ")} · ${e.eq.join("/")}</div>
      <div class="chips" style="margin-top:4px">${!ok?`<span class="tag">needs equipment</span>`:""}${blocked?`<span class="tag" style="color:var(--red)">paused: pain</span>`:""}${pr?`<span class="tag" style="color:var(--adj)">PR ${pr.e1rm} kg</span>`:""}</div></div></button>`; }).join("")||`<p class="muted small center">No exercises match.</p>`;
    $$(".mv").forEach(b=>b.onclick=()=>{ const e=EXM[b.dataset.id];
      modal(`<h2>${esc(e.n)}</h2><div class="demo">${demoSVG(e.d,190)}</div><p>🎯 ${esc(e.cue)}</p><p class="small muted">⚠️ Avoid: ${esc(e.mist)}</p>
       <table class="dt"><tr><td>Muscles</td><td>${e.m.join(", ")}</td></tr><tr><td>Equipment</td><td>${e.eq.join(", ")}</td></tr><tr><td>Target</td><td>${e.min?e.min+" min":`${e.reps[0]}–${e.reps[1]} ${e.sec?"seconds":"reps"}`}</td></tr>${e.reg?`<tr><td>Easier</td><td>${esc(e.reg)}</td></tr>`:""}${e.prog?`<tr><td>Harder</td><td>${esc(e.prog)}</td></tr>`:""}${S.prs[e.id]?`<tr><td>Your PR</td><td>${S.prs[e.id].load} kg × ${S.prs[e.id].reps} (e1RM ${S.prs[e.id].e1rm} kg)</td></tr>`:""}</table>
       <button class="btn-pri btn-block" onclick="closeModal()" style="margin-top:12px">Got it</button>`); }); };
  $("#mvQ").oninput=e=>{MOVEQ=e.target.value;draw();};
  $$(".mvF").forEach(c=>c.onclick=()=>{MOVEF=c.dataset.k;$$(".mvF").forEach(x=>x.classList.toggle("on",x===c));draw();});
  draw();
}

function vRecover(){

  ${Object.keys(ap).length?`<div class="card"><h3>Today's rehab routine</h3><p class="small muted">Pain-gated: during/after ≤ 3/10 and back to baseline next day → progress. Otherwise hold or regress.</p><div class="list">${routine.map(e=>`<div class="item small"><div style="flex:none">${demoSVG(e.d,48)}</div><div class="grow"><b>${esc(e.n)}</b><div class="muted">${esc(e.cue)}</div></div><span class="num">${e.min?e.min+" min":`2×${e.reps[0]}${e.sec?"s":""}`}</span></div>`).join("")||`<p class="small">Gentle walking and breathing; consider professional advice for this area.</p>`}</div>
   <button id="rStart" class="btn-pri" style="margin-top:10px">▶ Start recovery session</button></div>`:""}

function radarSVG(cur,overlays,size=320){
  const cx=size/2,cy=size/2,R=size/2-58,ax=Engine.AXES;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/6;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
  const poly=(v,col,op,dash)=>`<polygon points="${ax.map((a,i)=>pt(i,v[a[0]]).join(",")).join(" ")}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="5 4"':'style="filter:drop-shadow(0 0 8px '+col+')"'}/>`;

  const spokes=ax.map((a,i)=>{const [x,y]=pt(i,100);const [lx,ly]=pt(i,128);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--bd)"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="var(--tx)" font-weight="700">${a[1]}</text><text x="${lx}" y="${ly+14}" text-anchor="middle" font-size="11.5" fill="var(--pri)" font-weight="800" class="num">${cur[a[0]]}</text>`;}).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:420px;display:block;margin:auto" role="img" aria-label="Performance radar: ${ax.map(a=>a[1]+" "+cur[a[0]]).join(", ")}">${grid}${spokes}${overlays.map(o=>poly(o.v,o.c,.08,true)).join("")}${poly(cur,"#22D3EE",.28)}</svg>`;

  const wd=wk.filter(d=>waterTotal(d)>=Engine.targets(d).water).length; if(wd>=4) wins.push(`hit water target ${wd}/7 days`);
  const ar=avgR(wk);
  const focus=ar!=null&&ar<60?"Sleep & recovery: aim for your sleep target 5 nights this week.":`Lift your weakest axis — ${weak[1]}: 2 micro-challenges plus one focused session.`;
  return {wk,pw,tw,lw,ar,par:avgR(pw),wins,focus};
}

function passDialog(title,confirmTwice,cb){
  modal(`<h2>${title}</h2><label>Passphrase</label><input id="pp1" type="password" autocomplete="new-password">${confirmTwice?`<label>Repeat</label><input id="pp2" type="password"><div class="alert small" style="margin-top:10px">A forgotten passphrase <b>cannot be recovered</b>. Keep it safe.</div>`:""}<button id="ppOk" class="btn-pri btn-block" style="margin-top:12px">Continue</button>`,{onOpen:()=>{ $("#ppOk").onclick=()=>{ const a=$("#pp1").value; if(a.length<6){toast("Use at least 6 characters.");return;} if(confirmTwice&&a!==$("#pp2").value){toast("Passphrases don't match.");return;} closeModal(); cb(a); }; $("#pp1").onkeydown=e=>{if(e.key==="Enter"&&!confirmTwice)$("#ppOk").click();}; }});
}
function lockDialog(){
  if(S.meta.locked){ modal(`<h2>🔒 App lock</h2><div class="row"><button id="lkCh" class="btn-pri">Change passphrase</button><button id="lkOff">Disable lock</button></div>`,{onOpen:()=>{
    $("#lkCh").onclick=()=>passDialog("New passphrase",true,async p=>{SESSION_SALT=crypto.getRandomValues(new Uint8Array(16));SESSION_KEY=await deriveKey(p,SESSION_SALT);await persist();toast("Passphrase changed");});
    $("#lkOff").onclick=async()=>{S.meta.locked=false;SESSION_KEY=null;await persist();closeModal();render();toast("Lock disabled");}; }}); return; }
  passDialog("Set a passphrase",true,async p=>{ SESSION_SALT=crypto.getRandomValues(new Uint8Array(16)); SESSION_KEY=await deriveKey(p,SESSION_SALT); S.meta.locked=true; await persist(); render(); toast("🔒 App lock enabled"); });
}
function exportBackup(){
  passDialog("Backup passphrase",true,async p=>{ const salt=crypto.getRandomValues(new Uint8Array(16)); const key=await deriveKey(p,salt);
    S.meta.last_backup=nowISO();
    const pkg=await encryptJSON(S,key,salt); pkg.app="PathFit"; pkg.schema_version=SCHEMA_VERSION; pkg.created=nowISO();
    download(`pathfit-backup-${dkey()}.pathfit`,JSON.stringify(pkg),"application/json"); save(); toast("💾 Encrypted backup exported"); render(); });
}
async function importBackup(e){
  const f=e.target.files[0]; e.target.value=""; if(!f) return; let obj; try{ obj=JSON.parse(await f.text()); }catch(err){ toast("Invalid file"); return; }
  const apply=st=>{ if(!st||!st.meta||!st.profile){toast("Not a PathFit backup");return;} if((st.meta.schema_version||1)>SCHEMA_VERSION){toast("Backup is from a newer app version.");return;}
    if(!confirm("Replace all current data with this backup?")) return; const keepLock=S.meta.locked&&!!SESSION_KEY; S=migrate(st); S.meta.locked=keepLock; save(); applyTheme(); shell(); go("today"); toast("✅ Backup restored"); };
  if(obj.ct&&obj.iv){ passDialog("Backup passphrase",false,async p=>{ try{ const key=await deriveKey(p,unb64(obj.salt)); apply(await decryptJSON(obj,key)); }catch(err){ toast("Wrong passphrase or damaged file"); } }); }
  else apply(obj);
}

/* ======================= REMINDERS & ACTIONS ======================= */
async function notify(title,body,action){
  try{ if("Notification" in window&&Notification.permission==="granted"){
      const reg=SW_REG||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());
      const opts={body,icon:"icons/icon-192.png",badge:"icons/icon-192.png",tag:"pathfit-"+(action||"msg"),data:{action}};
      if(reg&&reg.showNotification){ await reg.showNotification(title,opts); return; } new Notification(title,opts); return; } }catch(e){}
  toast(`${title} — ${body}`,4000);
}
function inQuiet(hm){ const qs=S.settings.quietStart,qe=S.settings.quietEnd; return qs>qe?(hm>=qs||hm<qe):(hm>=qs&&hm<qe); }
function reminderTick(){
  if(!S.profile) return; const now=new Date(), k=dkey(), hm=pad(now.getHours())+":"+pad(now.getMinutes());
  if(S.settings.reminders&&!inQuiet(hm)){
    if(hm>=S.settings.checkinTime&&!S.checkins[k]&&!S.notified["ck"+k]){ S.notified["ck"+k]=1; save(); notify("🌤️ Morning check-in","15 seconds to tune today's plan to how you feel.","checkin"); }
    const n=Engine.todayNode(); const pt=S.profile.prefTime||"18:00";
    if(n&&n.planned<=k&&hm>=pt&&!S.sessions.some(s=>s.date===k)&&!S.notified["tr"+k]){ S.notified["tr"+k]=1; save(); notify("🏃 Time to train",`${n.title} · ~${Engine.buildSession(n,{}).estimate} min. Your path is waiting!`,"workout"); }
  }
  if(S.settings.waterNudges&&!document.hidden&&!inQuiet(hm)&&now.getMinutes()%45===0&&!W){ const t=Engine.targets(); const w=waterTotal(); const exp=t.water*clamp((now.getHours()-8)/12,0,1); if(w<t.water&&w<exp-500) toast("💧 Time for a glass of water?",4000,null); }
}
function handleAction(a){ if(!S.profile) return; if(a==="water") addWater(250); else if(a==="checkin") checkIn(); else if(a==="log") quickLog(); else if(a==="workout"){ go("today"); startSession(); } }

/* ======================= BOOT ======================= */
function hideSplash(){ const s=$("#splash"); if(s){ s.style.opacity="0"; setTimeout(()=>s.remove(),400); } }
function unlockScreen(pkg){
  $("#app").innerHTML=`<div class="onb center" style="margin-top:12vh">${ICON_SVG.replace("<svg","<svg width='90' height='90'")}<h2>PathFit is locked</h2><p class="muted small">Your data is encrypted on this device.</p>
   <input id="ulP" type="password" placeholder="Passphrase" autocomplete="current-password"><button id="ulB" class="btn-pri btn-block" style="margin-top:10px">Unlock</button>
   <p class="small muted" style="margin-top:20px">Forgot it? Data can't be recovered without the passphrase. You can restore from an encrypted backup after erasing.</p><button id="ulE" class="btn-ghost small">Erase & start over</button></div>`;
  const go_=async()=>{ $("#ulB").disabled=true; $("#ulB").textContent="Unlocking…"; try{ const salt=unb64(pkg.salt); const key=await deriveKey($("#ulP").value,salt); S=migrate(await decryptJSON(pkg,key)); SESSION_KEY=key; SESSION_SALT=salt; start(); }catch(e){ toast("Wrong passphrase"); $("#ulB").disabled=false; $("#ulB").textContent="Unlock"; } };
  $("#ulB").onclick=go_; $("#ulP").onkeydown=e=>{if(e.key==="Enter")go_();}; $("#ulP").focus();
  $("#ulE").onclick=async()=>{ if(prompt("Type ERASE to delete encrypted data")==="ERASE"){await DB.del("state_enc");location.reload();} };
}
function start(){
  applyTheme();
  if(!S.profile){ onboarding(); return; }
  shell(); Engine.checkMissed(); Engine.snapshotRadar(); checkAchievements(); save();
  const h=location.hash.slice(1); const v=["today","journey","body","insights","settings"].includes(h)?h:"today";
  history.replaceState({v},"","#"+v); go(v,false);
  const q=new URLSearchParams(location.search).get("action");
  if(q){ history.replaceState({v},"",location.pathname+"#"+v); setTimeout(()=>handleAction(q),300); }
  setInterval(reminderTick,60*1000); setTimeout(reminderTick,4000);
}
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change",()=>S.settings.theme==="system"&&applyTheme());
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(W) keepAwake(true); if(restInt) tickRest(); if(S.profile&&!$("#modalBg")&&VIEW==="today") render(); } });
(async function boot(){
  setupPWA();
  try{ await DB.open(); }catch(e){ $("#app").innerHTML=`<div class="onb"><h2>Storage unavailable</h2><p>This browser blocked local storage (private mode?). PathFit needs IndexedDB to keep your data on-device.</p></div>`; return; }
  const enc_=await DB.get("state_enc"); if(enc_){ unlockScreen(enc_); return; }
  const st=await DB.get("state"); if(st) S=migrate(st);
  start();
  try{ if(navigator.storage&&!(await navigator.storage.persisted())) navigator.storage.persist(); }catch(e){}
})();
</script>
